# Kitty Sidebar Dashboard theme
#
# Every value may be:
#   auto       -> derive from Kitty's current colors
#   #RRGGBB   -> exact color, fully opaque
#   #RRGGBB@0.0-1.0 -> exact color + alpha
#
# This file is hot-reloaded by the dashboard roughly every 2 seconds.
# Change a value, save, and the panel updates without restarting Kitty.

[colors]
title = #BCC1FF
text = auto
muted = auto

cpu = #CDD6F4 
memory = #CDD6F4
network_download = #6C83FF
network_upload = #FF97A5
audio = #CDD6F4

clock_face = auto
clock_outline = auto
clock_tick = auto
clock_hour = auto
clock_minute = #CDD6F4
clock_second = auto

grid = auto
card = auto
card_border = auto

