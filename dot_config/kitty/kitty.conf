# Theme
include ~/.config/kitty/themes/catppuccin-mocha.conf
# Font
# font_family Monaspace Neon Frozen
font_size 12

# Use Kitty's arbitrary splits layout
enabled_layouts splits

# Ghostty behavior:
# Cmd+D -> new pane to the RIGHT
map super+d launch --location=vsplit

# Cmd+Shift+D -> new pane BELOW
map super+shift+d launch --location=hsplit

# Cmd+W -> close current pane
map super+w close_window

# Navigate splits with Option + Arrow
map super+alt+left  neighboring_window left
map super+alt+right neighboring_window right
map super+alt+up    neighboring_window up
map super+alt+down  neighboring_window down

# Hide mouse while typing
mouse_hide_wait 0.0

# Window decorations
hide_window_decorations no
macos_titlebar_color background

# Treat Option as Alt
macos_option_as_alt both

# Scroll speed
wheel_scroll_multiplier 2.0

# Window padding (optional, Kitty default is 0)
window_padding_width 0
window_padding_height 0
window_margin_width 0
window_margin_height 0
resize_in_steps yes

# Cmd + Backspace = delete entire line
map super+backspace send_text all \x15

# Cmd + Left = beginning of line
map super+left send_text all \x01

# Cmd + Right = end of line
map super+right send_text all \x05


# BEGIN_KITTY_FONTS
font_family      family="MonaspiceNe Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

background_opacity 0.5
background_blur 0
macos_show_window_title_in none

allow_remote_control yes
listen_on unix:/tmp/kitty

