[general]
framerate = 60
bars = 24
sensitivity = 100
autosens = 0
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = portaudio
source = "BlackHole 2ch"

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = binary
bit_format = 16bit

[smoothing]
noise_reduction = 0.25
monstercat = 0
waves = 0
