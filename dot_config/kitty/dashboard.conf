# Kitty right-hand dashboard v9
enabled_layouts splits
window_border_width 1.0pt
active_border_color #4f6670
inactive_border_color #27323a
draw_minimal_borders yes

# Cmd+Shift+Option+D
map cmd+shift+alt+d launch --location=vsplit --bias=18 --keep-focus --title dashboard ~/.config/kitty/dashboard-venv/bin/python ~/.config/kitty/kitty-dashboard.py
